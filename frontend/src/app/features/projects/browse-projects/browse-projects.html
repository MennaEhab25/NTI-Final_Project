<section class="page">
  <h1>Browse Projects</h1>
  <div class="filters">
    <input [(ngModel)]="search" placeholder="Search projects" />
    <input [(ngModel)]="category" placeholder="Category" />
    <button (click)="load()">Search</button>
  </div>
  <p *ngIf="loading">Loading...</p>
  <div class="card" *ngFor="let project of projects">
    <h3>{{ project.title }}</h3>
    <p>{{ project.description }}</p>
    <strong>{{ project.budget }} EGP</strong> · {{ project.duration }} days
    <div><a [routerLink]="['/projects', project._id]">View details</a></div>
  </div>
  <p *ngIf="!loading && projects.length === 0">No projects found.</p>
</section>
