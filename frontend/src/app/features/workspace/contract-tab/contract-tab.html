<section class="page"><h1>Contract</h1><div class="load"><input [(ngModel)]="contractId" placeholder="Contract id"><input [(ngModel)]="userId" placeholder="Temporary user id"><button (click)="load()">Load</button></div><div class="card" *ngIf="contract"><p><b>Status:</b> {{contract.status}}</p><p><b>Amount:</b> {{contract.amount}} EGP</p><p><b>Commission:</b> {{contract.commissionAmount}} EGP</p><p><b>Freelancer receives:</b> {{contract.freelancerAmount}} EGP</p><p><b>Deadline:</b> {{contract.deadline | date}}</p><button (click)="start()">Start contract</button> <button (click)="download()">Download PDF</button><hr><h3>Request extension</h3><input type="number" [(ngModel)]="requestedDays"><input [(ngModel)]="reason" placeholder="Reason"><button (click)="extension()">Send request</button><p>{{message}}</p></div></section>
